version: '3.9'

services:
  math-api:
    build:
      context: .             
    container_name: math-api
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app       # live reload
    environment:
      - DB_FILE=/app/app/production.db
    command: >
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload